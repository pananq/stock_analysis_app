<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 股海罗盘</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="auth-page">
    <main class="auth-shell auth-shell-register">
        <section class="auth-visual">
            <a class="auth-brand" href="/">
                <span class="auth-brand-mark">
                    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="">
                </span>
                <span><strong>股海罗盘</strong><small>STOCK COMPASS</small></span>
            </a>
            <div class="auth-visual-copy">
                <span class="auth-kicker">YOUR MARKET WORKSPACE</span>
                <h1>从关注开始，<br>建立投资秩序。</h1>
                <p>创建个人账户，保存自己的关注列表、分析策略和每日市场洞察。</p>
            </div>
            <div class="auth-market-strip">
                <span><i class="fas fa-bookmark"></i> 独立关注列表</span>
                <span><i class="fas fa-envelope"></i> 个人日报</span>
                <span><i class="fas fa-shield-halved"></i> 安全隔离</span>
            </div>
        </section>

        <section class="auth-panel">
            <div class="auth-form-wrap">
                <div class="auth-form-heading">
                    <span class="auth-kicker">GET STARTED</span>
                    <h2>创建账户</h2>
                    <p>只需几步，即可建立你的个人工作台</p>
                </div>

                <div id="message-container"></div>

                <form id="register-form">
            <div class="mb-4">
                <label for="username" class="form-label">用户名</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control" id="username" name="username" required placeholder="8-16个英文字母">
                </div>
                <div class="form-text">用户名必须是8-16个英文字母</div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">密码</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" minlength="12" maxlength="128" required>
                </div>
                <div class="form-text">密码长度必须为12-128个字符</div>
            </div>
            <div class="mb-4">
                <label for="confirm-password" class="form-label">确认密码</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" id="confirm-password" name="confirm-password" minlength="12" maxlength="128" required>
                </div>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                    创建账户 <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </form>

                <p class="auth-switch">已有账户？ <a href="/login">立即登录</a></p>
            </div>
            <div class="auth-footnote">注册即表示你同意安全使用本平台。</div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script>
        $(document).ready(function() {
            $('#register-form').on('submit', function(e) {
                e.preventDefault();
                
                const username = $('#username').val();
                const password = $('#password').val();
                const confirmPassword = $('#confirm-password').val();
                
                if (!username || !password) {
                    showMessage('请输入用户名和密码', 'warning');
                    return;
                }
                
                if (password !== confirmPassword) {
                    showMessage('两次输入的密码不一致', 'warning');
                    return;
                }
                
                // 简单的用户名格式校验
                const usernameRegex = /^[a-zA-Z]{8,16}$/;
                if (!usernameRegex.test(username)) {
                    showMessage('用户名必须是8-16个英文字母', 'warning');
                    return;
                }
                
                const btn = $(this).find('button[type="submit"]');
                btn.prop('disabled', true).html('<span class="spinner-border spinner-border-sm"></span> 注册中...');
                
                apiRequest('/auth/register', 'POST', {
                    username: username,
                    password: password
                }, function(response) {
                    // 注册成功，跳转到登录页
                    showMessage('注册成功，请登录', 'success');
                    setTimeout(function() {
                        window.location.href = '/login';
                    }, 1500);
                }, function(xhr, status, error) {
                    // 注册失败，恢复按钮状态
                    // 错误消息已由 apiRequest 函数显示，无需重复显示
                    btn.prop('disabled', false).text('注册');
                });
            });
        });
    </script>
</body>
</html>
