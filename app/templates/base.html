<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}股海罗盘{% endblock %}</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- 自定义CSS -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    
    {% block extra_css %}{% endblock %}
</head>
<body class="app-body">
    <div class="ambient-orb ambient-orb-one"></div>
    <div class="ambient-orb ambient-orb-two"></div>
    <nav class="navbar navbar-expand-xl app-navbar sticky-top">
        <div class="container-fluid app-navbar-inner">
            <a class="navbar-brand brand-lockup" href="/">
                <span class="brand-symbol">
                    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="">
                </span>
                <span class="brand-copy">
                    <strong>股海罗盘</strong>
                    <small>STOCK COMPASS</small>
                </span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-label="展开导航">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav app-primary-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                            <span class="nav-icon"><i class="fas fa-chart-pie"></i></span>概览
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path.startswith('/strategies') %}active{% endif %}" href="/strategies/">
                            <span class="nav-icon"><i class="fas fa-wave-square"></i></span>策略
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path.startswith('/stocks') %}active{% endif %}" href="/stocks/">
                            <span class="nav-icon"><i class="fas fa-magnifying-glass-chart"></i></span>行情
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/watchlist' %}active{% endif %}" href="/watchlist">
                            <span class="nav-icon"><i class="fas fa-bookmark"></i></span>关注
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/reports' %}active{% endif %}" href="/reports">
                            <span class="nav-icon"><i class="fas fa-newspaper"></i></span>日报
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/api-tokens' %}active{% endif %}" href="/api-tokens">
                            <span class="nav-icon"><i class="fas fa-key"></i></span>API
                        </a>
                    </li>
                    <li class="nav-item admin-only" style="display: none;">
                        <a class="nav-link {% if request.path.startswith('/data') %}active{% endif %}" href="/data/">
                            <span class="nav-icon"><i class="fas fa-database"></i></span>数据
                        </a>
                    </li>
                    <li class="nav-item admin-only" style="display: none;">
                        <a class="nav-link {% if request.path.startswith('/system') %}active{% endif %}" href="/system/">
                            <span class="nav-icon"><i class="fas fa-sliders"></i></span>系统
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav app-utility-nav">
                    <li class="nav-item d-none d-xl-flex align-items-center">
                        <span class="market-pulse">
                            <span class="pulse-dot"></span>
                            <span id="current-time"></span>
                        </span>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link user-menu-trigger dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <span class="user-avatar"><i class="fas fa-user"></i></span>
                            <span id="user-name-display">用户</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li class="dropdown-profile">
                                <small>当前账户</small>
                                <strong id="user-role-display">角色</strong>
                            </li>
                            <li>
                                <a class="dropdown-item" href="/profile">
                                    <i class="fas fa-id-card me-2"></i>个人资料
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i class="fas fa-right-from-bracket me-2"></i>注销</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="app-main container-fluid">
        <!-- 消息提示区 -->
        <div id="message-container"></div>
        
        <!-- 页面内容 -->
        {% block content %}{% endblock %}
    </main>

    <!-- 页脚 -->
    <footer class="app-footer">
        <div class="container-fluid">
            <div class="footer-brand">
                <span class="footer-mark"></span>
                <span>股海罗盘 · 跨市场智能分析</span>
            </div>
            <span>© 2026 STOCK COMPASS</span>
        </div>
    </footer>

    <!-- 加载动画模态框 -->
    <div class="modal fade" id="loadingModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center">
                    <div class="spinner-border text-primary mb-3" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p id="loading-message">正在处理，请稍候...</p>
                    <div class="progress" id="loading-progress" style="display: none;">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" 
                             role="progressbar" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 确认对话框模态框 -->
    <div class="modal fade" id="confirmModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-question-circle text-primary"></i> 确认操作
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p id="confirm-message"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="confirm-ok-btn">确定</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    
    <!-- 自定义JS -->
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
