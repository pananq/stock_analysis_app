{% extends "base.html" %}

{% block title %}错误 {{ error_code }} - 股海罗盘{% endblock %}

{% block content %}
<div class="error-stage">
    <div class="error-panel">
        <div class="error-code">{{ error_code }}</div>
        <div class="error-icon"><i class="fas fa-compass"></i></div>
        <h1>{{ error_message }}</h1>
        <p>
                    {% if error_code == 404 %}
                    您访问的页面不存在，可能已被删除或移动。
                    {% elif error_code == 500 %}
                    服务器遇到了一个错误，我们正在努力修复。
                    {% else %}
                    发生了一个错误，请稍后再试。
                    {% endif %}
        </p>
        <div class="d-flex flex-wrap justify-content-center gap-2 mt-4">
            <a href="/" class="btn btn-primary"><i class="fas fa-home"></i>返回首页</a>
            <button onclick="goBack()" class="btn btn-secondary"><i class="fas fa-arrow-left"></i>返回上一页</button>
        </div>
    </div>
</div>
{% endblock %}
